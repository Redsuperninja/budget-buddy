# Alembic settings for developers. Normal users never run this: the Home Base upgrades its
# database automatically when it starts. The database location comes from the app settings
# (BUDGET_BUDDY_DATA_DIR), not from this file.
#
#   .venv\Scripts\alembic upgrade head
#   .venv\Scripts\alembic revision --autogenerate -m "describe the change"

[alembic]
script_location = %(here)s/app/migrations
prepend_sys_path = .
path_separator = os

[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "budget-buddy-server"
description = "Budget Buddy Home Base: local-first budgeting and tax-prep server."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.12",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.16",
    "cryptography>=44",
    "keyring>=25",
    "pynacl>=1.5,<2",
    "segno>=1.6,<2",  # draws the pairing QR code
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=7.0",
    "httpx2>=2.13",
    "ruff>=0.8",
]
# Makes the packaged Home Base that the desktop app starts (packaging/windows/home-base.spec at the repo root).
# PyInstaller: GPL with an exception that allows building apps like this one.
package = ["pyinstaller>=6.10"]

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.tax_data" = ["*.json"]
"app.migrations" = ["script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

# CI runs `pytest --cov` and fails below this line coverage (docs/dev/testing.md, "Coverage rules").
[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 94
skip_covered = true
show_missing = true

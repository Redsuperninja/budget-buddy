name: Mobile CI

# Paused until 2026-11-22 (docs/dev/testing.md#ci): only runs by hand (Actions, Run workflow).
# To bring it back, delete `workflow_dispatch:` and uncomment the lines under it: checks then run
# on pull requests into main and on main itself, never on stacked branches.
on:
  workflow_dispatch:
#  pull_request:
#    branches: [main]
#    paths:
#      - "mobile/**"
#      - ".github/workflows/mobile-ci.yml"
#      - "docs/api/**"
#  push:
#    branches: [main]
#    paths:
#      - "mobile/**"
#      - ".github/workflows/mobile-ci.yml"
#      - "docs/api/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --ci --coverage

name: desktop-ci

# Paused until 2026-11-22 (docs/dev/testing.md#ci): only runs by hand (Actions, Run workflow).
# To bring it back, delete `workflow_dispatch:` and uncomment the lines under it: checks then run
# on pull requests into main and on main itself, never on stacked branches.
on:
  workflow_dispatch:
#  pull_request:
#    branches: [main]
#    paths:
#      - "desktop/**"
#      - ".github/workflows/desktop-ci.yml"
#      - "docs/api/**"
#  push:
#    branches: [main]
#    paths:
#      - "desktop/**"
#      - ".github/workflows/desktop-ci.yml"
#      - "docs/api/**"

permissions:
  contents: read

jobs:
  test:
    # The desktop app is Windows-only (tray, Start with Windows, one tray at a time).
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: desktop/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Test
        run: pytest --cov

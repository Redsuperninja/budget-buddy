name: desktop-ci

# Paused until 2026-11-22 (docs/dev/testing.md#ci): only runs by hand (Actions, Run workflow).
# To bring it back, delete `workflow_dispatch:` and uncomment the lines under it: checks then run
# on pull requests into main and on main itself, never on stacked branches.
on:
  workflow_dispatch:
#  pull_request:
#    branches: [main]
#    paths:
#      - "desktop/**"
#      - ".github/workflows/desktop-ci.yml"
#      - "docs/api/**"
#  push:
#    branches: [main]
#    paths:
#      - "desktop/**"
#      - ".github/workflows/desktop-ci.yml"
#      - "docs/api/**"

permissions:
  contents: read

jobs:
  test:
    # The desktop app is Windows-only (tray, Start with Windows, one tray at a time).
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: desktop/requirements-dev.txt
      - name: Install
        # Exact versions with hashes (ADR-0013), then this part with nothing more downloaded.
        run: |
          pip install --require-hashes -r requirements-build.txt
          pip install --require-hashes --no-build-isolation -r requirements-dev.txt
          pip install --no-deps --no-build-isolation -e .
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Test
        run: pytest --cov

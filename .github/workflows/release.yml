name: release

# Pushing a tag like v0.2.0 builds the Windows download (scripts/release/make-release.ps1) and attaches it to a draft
# GitHub Release, which the owner checks and publishes by hand (docs/dev/release.md). Nothing is signed yet.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check the tag matches the version
        shell: pwsh
        run: |
          $version = (Select-String -Path server/app/__init__.py -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} doesn't match version $version." }
      - name: Build the download
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts\release\make-release.ps1
      - name: Attach it to a draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --draft --title "Budget Buddy ${{ github.ref_name }}" `
            --notes "See CHANGELOG.md. Windows: download the zip, unzip it, and double-click Install Budget Buddy. Phones: open Budget Buddy in your phone's web browser (Devices, Other devices)." `
            (Get-ChildItem dist/*.zip, dist/*.sha256).FullName

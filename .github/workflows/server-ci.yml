name: server-ci

# Paused until 2026-11-22 (docs/dev/testing.md#ci): only runs by hand (Actions, Run workflow).
# To bring it back, delete `workflow_dispatch:` and uncomment the lines under it: checks then run
# on pull requests into main and on main itself, never on stacked branches.
on:
  workflow_dispatch:
#  pull_request:
#    branches: [main]
#    paths:
#      - "server/**"
#      - ".github/workflows/server-ci.yml"
#      - "dashboard/**"
#      - "mobile/src/**"
#      - "desktop/budget_buddy_desktop/**"
#      - "scripts/**"
#      - "docs/api/**"
#  push:
#    branches: [main]
#    paths:
#      - "server/**"
#      - ".github/workflows/server-ci.yml"
#      - "dashboard/**"
#      - "mobile/src/**"
#      - "desktop/budget_buddy_desktop/**"
#      - "scripts/**"
#      - "docs/api/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - name: Nothing private in tracked files (emails, user paths, public IPs, databases, keys)
        working-directory: .
        run: python scripts/dev/check_public.py
      - name: Install
        # Exact versions with hashes (ADR-0013), then this part with nothing more downloaded.
        run: |
          pip install --require-hashes -r requirements-build.txt
          pip install --require-hashes --no-build-isolation -r requirements-dev.txt
          pip install --no-deps --no-build-isolation -e .
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Test
        # CI runners have no OS password vault, so keep the encryption key in memory. The memory
        # key store also needs the separate test-only switch (security review H1, PR #22).
        env:
          BUDGET_BUDDY_KEY_STORE: memory
          BUDGET_BUDDY_INSECURE_TEST_KEYSTORE: "1"
        run: pytest --cov
      - name: Scripts (lint, format, tests)
        working-directory: .
        run: |
          ruff check scripts
          ruff format --check scripts
          pytest -q scripts/tests

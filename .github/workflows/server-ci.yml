name: server-ci

# Paused until 2026-11-22 (docs/dev/testing.md#ci): only runs by hand (Actions, Run workflow).
# To bring it back, delete `workflow_dispatch:` and uncomment the lines under it: checks then run
# on pull requests into main and on main itself, never on stacked branches.
on:
  workflow_dispatch:
#  pull_request:
#    branches: [main]
#    paths:
#      - "server/**"
#      - ".github/workflows/server-ci.yml"
#      - "dashboard/**"
#      - "mobile/src/**"
#      - "desktop/budget_buddy_desktop/**"
#      - "scripts/**"
#      - "docs/api/**"
#  push:
#    branches: [main]
#    paths:
#      - "server/**"
#      - ".github/workflows/server-ci.yml"
#      - "dashboard/**"
#      - "mobile/src/**"
#      - "desktop/budget_buddy_desktop/**"
#      - "scripts/**"
#      - "docs/api/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Test
        # CI runners have no OS password vault, so keep the encryption key in memory. The memory
        # key store also needs the separate test-only switch (security review H1, PR #22).
        env:
          BUDGET_BUDDY_KEY_STORE: memory
          BUDGET_BUDDY_INSECURE_TEST_KEYSTORE: "1"
        run: pytest --cov

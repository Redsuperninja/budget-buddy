# Weekly update pull requests for what Budget Buddy depends on (issue #6). Each one runs CI like any PR and is
# merged only after a look at what changed (docs/dev/conventions.md, "Dependencies"). The 7-day cooldown skips
# versions under a week old: a hijacked release is usually caught by then.
version: 2
updates:
  # GitHub Actions are pinned to a full commit; Dependabot moves the pin and its version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: pip
    directories: [/server, /desktop]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    # Only the lock files (requirements*.txt, ADR-0013); pyproject.toml keeps its lower limits.
    versioning-strategy: lockfile-only
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  # The phone app: Expo SDK upgrades (major versions) are done by hand with `npx expo install --fix`,
  # because Expo's packages have to move together.
  - package-ecosystem: npm
    directory: /mobile
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # React Native and React move only with the Expo SDK (`npx expo install --fix`): RN 0.87 / React 19.3
      # broke Expo 57 (#172). Patch updates are still fine.
      - dependency-name: "react-native"
        update-types: [version-update:semver-minor]
      - dependency-name: "react"
        update-types: [version-update:semver-minor]
      - dependency-name: "react-dom"
        update-types: [version-update:semver-minor]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-minor]
      - dependency-name: "react-native-screens"
        update-types: [version-update:semver-minor]
      - dependency-name: "react-native-safe-area-context"
        update-types: [version-update:semver-minor]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
